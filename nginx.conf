server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов (полезно для тикетов с картинками)
    client_max_body_size 16M;

    # 1. Раздача статики (CSS, JS, логотип) напрямую из папки контейнера
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Прямая раздача иконки сайта, чтобы разгрузить Flask от лишних 404 ошибок
    location /favicon.ico {
        alias /app/static/favicon.ico;
        log_not_found off;
        access_log off;
    }

    # 3. Проксирование всех остальных динамических запросов на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;

        # Передача реальных заголовков клиента (IP, хост, протокол)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Тайм-ауты для тяжелых запросов к базе данных
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
